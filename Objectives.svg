<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">Architectural elevation drawing</title>
  <desc id="d">A blueprint-style elevation of a modern building with rooftop solar panels, green roof trees, a sun, people at street level and dimension lines.</desc>
  <defs>
    <pattern id="minor" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".08" stroke-width="1"/>
    </pattern>
    <pattern id="major" width="200" height="200" patternUnits="userSpaceOnUse">
      <path d="M200 0H0V200" fill="none" stroke="#fff" stroke-opacity=".16" stroke-width="1.5"/>
    </pattern>
  </defs>

  <rect width="800" height="1000" fill="#23518C"/>
  <rect width="800" height="1000" fill="url(#minor)"/>
  <rect width="800" height="1000" fill="url(#major)"/>

  <!-- construction lines -->
  <g stroke="#fff" stroke-opacity=".35" stroke-dasharray="10 8" stroke-width="1.5">
    <line x1="40" y1="300" x2="760" y2="300"/>
    <line x1="400" y1="240" x2="400" y2="860"/>
  </g>

  <!-- sun -->
  <g fill="none" stroke="#F4C95D" stroke-width="3" stroke-linecap="round">
    <circle cx="640" cy="170" r="46"/>
    <line x1="640" y1="112" x2="640" y2="92" transform="rotate(0 640 170)"/>
    <line x1="640" y1="112" x2="640" y2="92" transform="rotate(30 640 170)"/>
    <line x1="640" y1="112" x2="640" y2="92" transform="rotate(60 640 170)"/>
    <line x1="640" y1="112" x2="640" y2="92" transform="rotate(90 640 170)"/>
    <line x1="640" y1="112" x2="640" y2="92" transform="rotate(120 640 170)"/>
    <line x1="640" y1="112" x2="640" y2="92" transform="rotate(150 640 170)"/>
    <line x1="640" y1="112" x2="640" y2="92" transform="rotate(180 640 170)"/>
    <line x1="640" y1="112" x2="640" y2="92" transform="rotate(210 640 170)"/>
    <line x1="640" y1="112" x2="640" y2="92" transform="rotate(240 640 170)"/>
    <line x1="640" y1="112" x2="640" y2="92" transform="rotate(270 640 170)"/>
    <line x1="640" y1="112" x2="640" y2="92" transform="rotate(300 640 170)"/>
    <line x1="640" y1="112" x2="640" y2="92" transform="rotate(330 640 170)"/>
  </g>

  <!-- north arrow -->
  <g fill="none" stroke="#fff" stroke-width="2">
    <circle cx="96" cy="120" r="34"/>
    <path d="M96 92 L108 132 L96 124 L84 132 Z" fill="#fff"/>
  </g>
  <text x="96" y="80" fill="#fff" font-family="Josefin Sans, Century Gothic, sans-serif" font-size="18" text-anchor="middle">N</text>

  <!-- buildings -->
  <g fill="none" stroke="#fff" stroke-width="2.5" stroke-linejoin="round">
    <!-- tall block -->
    <rect x="260" y="300" width="280" height="500" fill="#23518C"/>
    <!-- low left block -->
    <rect x="100" y="560" width="160" height="240" fill="#23518C"/>
    <!-- right block -->
    <rect x="540" y="480" width="160" height="320" fill="#23518C"/>
  </g>

  <!-- facade fins and floor lines -->
  <g stroke="#fff" stroke-width="1.5" stroke-opacity=".75">
    <line x1="300" y1="300" x2="300" y2="800"/>
    <line x1="340" y1="300" x2="340" y2="800"/>
    <line x1="380" y1="300" x2="380" y2="800"/>
    <line x1="420" y1="300" x2="420" y2="800"/>
    <line x1="460" y1="300" x2="460" y2="800"/>
    <line x1="500" y1="300" x2="500" y2="800"/>
    <line x1="260" y1="350" x2="540" y2="350"/>
    <line x1="260" y1="400" x2="540" y2="400"/>
    <line x1="260" y1="450" x2="540" y2="450"/>
    <line x1="260" y1="500" x2="540" y2="500"/>
    <line x1="260" y1="550" x2="540" y2="550"/>
    <line x1="260" y1="600" x2="540" y2="600"/>
    <line x1="260" y1="650" x2="540" y2="650"/>
    <line x1="260" y1="700" x2="540" y2="700"/>
    <line x1="260" y1="750" x2="540" y2="750"/>
    <line x1="140" y1="560" x2="140" y2="800"/><line x1="180" y1="560" x2="180" y2="800"/><line x1="220" y1="560" x2="220" y2="800"/>
    <line x1="100" y1="620" x2="260" y2="620"/><line x1="100" y1="680" x2="260" y2="680"/><line x1="100" y1="740" x2="260" y2="740"/>
    <line x1="600" y1="500" x2="600" y2="800"/><line x1="640" y1="500" x2="640" y2="800"/>
    <line x1="560" y1="560" x2="680" y2="560"/><line x1="560" y1="620" x2="680" y2="620"/><line x1="560" y1="680" x2="680" y2="680"/>
  </g>

  <!-- glazing tint -->
  <g fill="#fff" fill-opacity=".16">
    <rect x="300" y="400" width="40" height="50"/><rect x="380" y="400" width="40" height="50"/>
    <rect x="340" y="500" width="40" height="50"/><rect x="460" y="500" width="40" height="50"/>
    <rect x="300" y="600" width="40" height="50"/><rect x="420" y="600" width="40" height="50"/>
    <rect x="380" y="700" width="40" height="50"/><rect x="500" y="700" width="40" height="50"/>
    <rect x="560" y="500" width="120" height="60"/><rect x="140" y="620" width="40" height="60"/>
  </g>

  <!-- cantilever roof + entrance -->
  <rect x="520" y="472" width="230" height="9" fill="#fff"/>
  <rect x="596" y="736" width="48" height="64" fill="#fff" fill-opacity=".3" stroke="#fff" stroke-width="2"/>

  <!-- solar panels -->
  <g fill="#F4C95D" fill-opacity=".35" stroke="#F4C95D" stroke-width="2">
    <polygon points="270,300 310,300 322,276 282,276"/>
    <polygon points="322,300 362,300 374,276 334,276"/>
    <polygon points="374,300 414,300 426,276 386,276"/>
    <polygon points="426,300 466,300 478,276 438,276"/>
    <polygon points="478,300 518,300 530,276 490,276"/>
  </g>

  <!-- green roof trees -->
  <g fill="none" stroke="#fff" stroke-width="2">
    <circle cx="130" cy="528" r="22"/><line x1="130" y1="550" x2="130" y2="560"/>
    <circle cx="185" cy="522" r="28"/><line x1="185" y1="550" x2="185" y2="560"/>
    <circle cx="238" cy="532" r="18"/><line x1="238" y1="550" x2="238" y2="560"/>
    <circle cx="745" cy="745" r="30"/><line x1="745" y1="775" x2="745" y2="800"/>
  </g>

  <!-- ground and people -->
  <line x1="40" y1="800" x2="780" y2="800" stroke="#fff" stroke-width="3.5"/>
  <g stroke="#fff" stroke-width="1.5" stroke-opacity=".6">
    <path d="M60 800 l-12 14 M110 800 l-12 14 M160 800 l-12 14 M210 800 l-12 14 M260 800 l-12 14 M310 800 l-12 14 M360 800 l-12 14 M410 800 l-12 14 M460 800 l-12 14 M510 800 l-12 14 M560 800 l-12 14 M610 800 l-12 14 M660 800 l-12 14 M710 800 l-12 14 M760 800 l-12 14"/>
  </g>
  <g fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round">
    <path d="M340 776 V792 M340 792 L335 800 M340 792 L345 800 M333 784 H347"/><circle cx="340" cy="769" r="6"/>
    <path d="M358 776 V792 M358 792 L353 800 M358 792 L363 800 M351 784 H365"/><circle cx="358" cy="769" r="6"/>
    <path d="M478 776 V792 M478 792 L473 800 M478 792 L483 800 M471 784 H485"/><circle cx="478" cy="769" r="6"/>
    <path d="M612 776 V792 M612 792 L607 800 M612 792 L617 800 M605 784 H619"/><circle cx="612" cy="769" r="6"/>
    <path d="M690 776 V792 M690 792 L685 800 M690 792 L695 800 M683 784 H697"/><circle cx="690" cy="769" r="6"/>
  </g>

  <!-- dimension line -->
  <g stroke="#fff" stroke-width="1.5" fill="none">
    <line x1="778" y1="300" x2="778" y2="800"/>
    <line x1="770" y1="300" x2="786" y2="300"/><line x1="770" y1="800" x2="786" y2="800"/>
    <line x1="30" y1="560" x2="30" y2="800"/>
    <line x1="22" y1="560" x2="38" y2="560"/><line x1="22" y1="800" x2="38" y2="800"/>
  </g>

  <!-- title block -->
  <g fill="none" stroke="#fff" stroke-width="2">
    <rect x="40" y="880" width="720" height="84"/>
    <line x1="520" y1="880" x2="520" y2="964"/>
  </g>
  <g fill="#fff" font-family="Josefin Sans, Century Gothic, sans-serif">
    <text x="64" y="918" font-size="26" letter-spacing="2">INTERFACE ARCHITECTS</text>
    <text x="64" y="946" font-size="16" fill-opacity=".8" letter-spacing="1.5">Sustainable · Collaborative · Community</text>
    <text x="544" y="918" font-size="16" fill-opacity=".8">ELEVATION A</text>
    <text x="544" y="946" font-size="16" fill-opacity=".8">SCALE 1:100</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
